# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-boot-opt"
BBFILE_PATTERN_meta-boot-opt = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-boot-opt = "6"

# openembedded-layer = meta-oe, where the lvgl recipe lives.
LAYERDEPENDS_meta-boot-opt = "core openembedded-layer"
LAYERSERIES_COMPAT_meta-boot-opt = "scarthgap"

# Kernel arguments shared by both boot paths: extlinux.conf (U-Boot proper) and the
# falcon "args" blob built by linux-bb.org.
# Keep info-level kernel messages off the serial console (still in dmesg).
UBOOT_EXTLINUX_KERNEL_ARGS:append = " loglevel=4"
