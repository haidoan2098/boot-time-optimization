# --- Falcon mode: SPL loads the kernel directly, U-Boot proper is skipped ---
# Falcon support (SPL_OS_BOOT) is already built into SPL by am335x_evm_defconfig.
# It stays disarmed because spl_start_uboot() (board/ti/am335x/board.c) asks the
# environment for boot_os, and SPL has no environment storage. Without env support
# in SPL, falcon runs unless 'c' is pressed on the serial console during SPL.
# If SPL cannot find "args" or the kernel on the boot partition it falls back to
# U-Boot proper, so a missing file does not leave the board unbootable.

# The kernel on the boot partition is a plain zImage (no uImage header); SPL
# accepts it through bootz_setup() because CMD_BOOTZ is enabled.
CONFIG_SPL_FS_LOAD_KERNEL_NAME="zImage"

# Remove environment support from SPL so falcon is not gated on boot_os.
# CONFIG_SPL_ENV_SUPPORT is not set
# SPL network and USB-ethernet boot call the environment API; they are not
# used when booting from the SD card.
# CONFIG_SPL_NET is not set
# CONFIG_SPL_ETH is not set
# CONFIG_SPL_USB_ETHER is not set
