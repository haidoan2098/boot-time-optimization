# Built-in support for SoCs/PMICs that are not on BeagleBone Black
# (AM3358 + TPS65217). None of these have a node in the BBB device tree,
# so their drivers never probe; dropping them only saves init time and size.

# Other SoCs
# CONFIG_SOC_OMAP5 is not set
# CONFIG_SOC_DRA7XX is not set

# Other PMICs
# CONFIG_MFD_PALMAS is not set
# CONFIG_REGULATOR_PALMAS is not set
# CONFIG_MFD_TPS65218 is not set
# CONFIG_REGULATOR_TPS65218 is not set
# CONFIG_MFD_TPS65219 is not set
# CONFIG_REGULATOR_TPS65219 is not set
# CONFIG_MFD_TPS6594 is not set
# CONFIG_MFD_TPS6594_I2C is not set
# CONFIG_MFD_TPS6594_SPI is not set
# CONFIG_REGULATOR_TPS6594 is not set

# OMAP4/5/DRA7-only blocks
# CONFIG_MFD_OMAP_USB_HOST is not set
# CONFIG_REGULATOR_TI_ABB is not set
# CONFIG_REGULATOR_PBIAS is not set
